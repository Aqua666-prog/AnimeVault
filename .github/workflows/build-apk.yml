name: Build AnimeVault APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/firebase-google-signin
      - feature/premium-onboarding
      - feature/in-app-updater
      - feature/update-test-304

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check final diff whitespace
        run: |
          git diff --check HEAD^ HEAD
          if git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
            git diff --check HEAD^2 HEAD
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Firebase configuration handling
        run: python3 -m unittest discover -s tools -p 'test_restore_google_services.py'

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: python3 tools/restore-google-services.py

      - name: Restore debug signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANIMEVAULT_DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/animevault-debug.jks"
          test -s "$RUNNER_TEMP/animevault-debug.jks"
          echo "ANIMEVAULT_DEBUG_KEYSTORE=$RUNNER_TEMP/animevault-debug.jks" >> "$GITHUB_ENV"

      - name: Diagnose debug signing
        env:
          ANIMEVAULT_DEBUG_STORE_PASSWORD: ${{ secrets.ANIMEVAULT_DEBUG_STORE_PASSWORD }}
          ANIMEVAULT_DEBUG_KEY_ALIAS: ${{ secrets.ANIMEVAULT_DEBUG_KEY_ALIAS }}
          ANIMEVAULT_DEBUG_KEY_PASSWORD: ${{ secrets.ANIMEVAULT_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Checking restored keystore..."
          sha256sum "$ANIMEVAULT_DEBUG_KEYSTORE"
          keytool -list \
            -storetype PKCS12 \
            -keystore "$ANIMEVAULT_DEBUG_KEYSTORE" \
            -storepass "$ANIMEVAULT_DEBUG_STORE_PASSWORD" \
            -alias "$ANIMEVAULT_DEBUG_KEY_ALIAS" >/dev/null
          echo "Keystore and alias: OK"
          echo "Checking private key password..."
          keytool -importkeystore \
            -srckeystore "$ANIMEVAULT_DEBUG_KEYSTORE" \
            -srcstoretype PKCS12 \
            -srcstorepass "$ANIMEVAULT_DEBUG_STORE_PASSWORD" \
            -srckeypass "$ANIMEVAULT_DEBUG_KEY_PASSWORD" \
            -srcalias "$ANIMEVAULT_DEBUG_KEY_ALIAS" \
            -destkeystore "$RUNNER_TEMP/signing-check.p12" \
            -deststoretype PKCS12 \
            -deststorepass "$ANIMEVAULT_DEBUG_STORE_PASSWORD" \
            -destkeypass "$ANIMEVAULT_DEBUG_STORE_PASSWORD" \
            -noprompt >/dev/null
          echo "Private key: OK"

      - name: Make scripts executable
        run: |
          chmod +x gradlew
          chmod +x tools/*.sh 2>/dev/null || true

      - name: Verify source
        run: |
          python3 -m unittest discover -s tools -p 'test_update_manifest.py'
          bash tools/verify-final.sh
          bash tools/verify-2.0.0.sh

      - name: Compile Kotlin
        env:
          KODIK_API_TOKEN: ${{ secrets.KODIK_API_TOKEN }}
        run: ./gradlew --no-daemon compileDebugKotlin

      - name: Unit tests
        env:
          KODIK_API_TOKEN: ${{ secrets.KODIK_API_TOKEN }}
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Android lint
        env:
          KODIK_API_TOKEN: ${{ secrets.KODIK_API_TOKEN }}
        run: ./gradlew --no-daemon lintDebug

      - name: Build APK
        env:
          KODIK_API_TOKEN: ${{ secrets.KODIK_API_TOKEN }}
          ANIMEVAULT_DEBUG_STORE_PASSWORD: ${{ secrets.ANIMEVAULT_DEBUG_STORE_PASSWORD }}
          ANIMEVAULT_DEBUG_KEY_ALIAS: ${{ secrets.ANIMEVAULT_DEBUG_KEY_ALIAS }}
          ANIMEVAULT_DEBUG_KEY_PASSWORD: ${{ secrets.ANIMEVAULT_DEBUG_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p dist
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/AnimeVault.apk

      - name: Download Build 81 for certificate comparison
        if: github.ref == 'refs/heads/feature/update-test-304'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39885719184
          name: AnimeVault-debug-290dfd40c81143746b5a8da61310c0405a04da96
          path: ${{ runner.temp }}/animevault-build-81

      - name: Verify APK signature and prepare update metadata
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/aapt"
          test -x "$BUILD_TOOLS/apksigner"
          "$BUILD_TOOLS/apksigner" verify --verbose dist/AnimeVault.apk
          "$BUILD_TOOLS/aapt" dump badging dist/AnimeVault.apk > "$RUNNER_TEMP/update-badging.txt"
          python3 tools/prepare-update-manifest.py \
            --apk dist/AnimeVault.apk \
            --badging "$RUNNER_TEMP/update-badging.txt" \
            --output dist/animevault-update.json

      - name: Verify 3.0.4 metadata and signing against installed Build 81
        if: github.ref == 'refs/heads/feature/update-test-304'
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$RUNNER_TEMP/animevault-build-81/AnimeVault.apk" | tee "$RUNNER_TEMP/update-test-baseline-signing.txt"
          "$BUILD_TOOLS/apksigner" verify --print-certs dist/AnimeVault.apk | tee "$RUNNER_TEMP/update-test-current-signing.txt"
          "$BUILD_TOOLS/aapt" dump badging "$RUNNER_TEMP/animevault-build-81/AnimeVault.apk" > "$RUNNER_TEMP/update-test-baseline-badging.txt"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path
          temporary = Path(os.environ["RUNNER_TEMP"])
          def certificates(filename):
              output = (temporary / filename).read_text()
              fingerprints = set(re.findall(r"certificate SHA-256 digest:\s*([0-9a-fA-F]{64})", output))
              assert fingerprints, "apksigner returned no certificate SHA-256 digest: " + output
              return {fingerprint.lower() for fingerprint in fingerprints}
          previous = certificates("update-test-baseline-signing.txt")
          current = certificates("update-test-current-signing.txt")
          assert previous == current, "APK certificate differs from installed Build 81"
          print("APK_CERTIFICATE_MATCHES_BUILD_81=" + ",".join(sorted(current)))
          baseline = (Path(os.environ["RUNNER_TEMP"]) / "update-test-baseline-badging.txt").read_text()
          package_line = next(line for line in baseline.splitlines() if line.startswith("package: "))
          installed = dict(re.findall(r"([A-Za-z][A-Za-z0-9]*)='([^']*)'", package_line))
          assert installed["name"] == "com.sergey.animevault"
          assert installed["versionCode"] == "63" and installed["versionName"] == "3.0.3"
          apk = Path("dist/AnimeVault.apk")
          metadata = json.loads(Path("dist/animevault-update.json").read_text())
          assert metadata["schemaVersion"] == 1
          assert metadata["packageName"] == "com.sergey.animevault"
          assert metadata["versionCode"] == 64 and metadata["versionName"] == "3.0.4"
          assert metadata["minSdk"] == 24 and metadata["apkFileName"] == apk.name
          digest = hashlib.sha256()
          with apk.open("rb") as source:
              for block in iter(lambda: source.read(64 * 1024), b""):
                  digest.update(block)
          assert metadata["sha256"] == digest.hexdigest(), "APK SHA-256 does not match metadata"
          print("BASELINE_VERSION=3.0.3 (63)")
          print("TEST_UPDATE_METADATA=" + json.dumps(metadata, sort_keys=True))
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeVault-debug-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  onboarding-ui:
    if: github.ref != 'refs/heads/feature/in-app-updater' && github.ref != 'refs/heads/feature/update-test-304'
    name: Onboarding UI · API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 35]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: python3 tools/restore-google-services.py

      - name: Restore existing debug signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANIMEVAULT_DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/animevault-debug.jks"
          test -s "$RUNNER_TEMP/animevault-debug.jks"
          echo "ANIMEVAULT_DEBUG_KEYSTORE=$RUNNER_TEMP/animevault-debug.jks" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run onboarding flows
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANIMEVAULT_DEBUG_STORE_PASSWORD: ${{ secrets.ANIMEVAULT_DEBUG_STORE_PASSWORD }}
          ANIMEVAULT_DEBUG_KEY_ALIAS: ${{ secrets.ANIMEVAULT_DEBUG_KEY_ALIAS }}
          ANIMEVAULT_DEBUG_KEY_PASSWORD: ${{ secrets.ANIMEVAULT_DEBUG_KEY_PASSWORD }}
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/run-onboarding-ui-tests.sh

      - name: Upload onboarding previews and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnimeVault-onboarding-API-${{ matrix.api-level }}
          path: |
            onboarding-preview/*.png
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
