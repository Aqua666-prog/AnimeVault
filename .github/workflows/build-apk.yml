name: Build AnimeVault APK

on:
  workflow_dispatch:
  push:
    branches:
      - release/2.0.0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make scripts executable
        run: |
          chmod +x gradlew
          chmod +x tools/*.sh 2>/dev/null || true

      - name: Verify source
        run: |
          bash tools/verify-final.sh
          bash tools/verify-2.0.0.sh

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p dist
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/AnimeVault-2.0.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeVault-2.0.0-debug
          path: dist/AnimeVault-2.0.0-debug.apk
          if-no-files-found: error
          retention-days: 14
