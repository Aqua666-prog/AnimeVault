name: Build AnimeVault APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore debug signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANIMEVAULT_DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/animevault-debug.jks"
          test -s "$RUNNER_TEMP/animevault-debug.jks"
          echo "ANIMEVAULT_DEBUG_KEYSTORE=$RUNNER_TEMP/animevault-debug.jks" >> "$GITHUB_ENV"

      - name: Make scripts executable
        run: |
          chmod +x gradlew
          chmod +x tools/*.sh 2>/dev/null || true

      - name: Verify source
        run: |
          bash tools/verify-final.sh
          bash tools/verify-2.0.0.sh

      - name: Unit tests
        env:
          KODIK_API_TOKEN: ${{ secrets.KODIK_API_TOKEN }}
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Android lint
        env:
          KODIK_API_TOKEN: ${{ secrets.KODIK_API_TOKEN }}
        run: ./gradlew --no-daemon lintDebug

      - name: Build APK
        env:
          KODIK_API_TOKEN: ${{ secrets.KODIK_API_TOKEN }}
          ANIMEVAULT_DEBUG_STORE_PASSWORD: ${{ secrets.ANIMEVAULT_DEBUG_STORE_PASSWORD }}
          ANIMEVAULT_DEBUG_KEY_ALIAS: ${{ secrets.ANIMEVAULT_DEBUG_KEY_ALIAS }}
          ANIMEVAULT_DEBUG_KEY_PASSWORD: ${{ secrets.ANIMEVAULT_DEBUG_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p dist
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/AnimeVault-3.0.3-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeVault-3.0.3-debug
          path: dist/AnimeVault-3.0.3-debug.apk
          if-no-files-found: error
          retention-days: 14
