name: Build AnimeVault APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make scripts executable
        run: chmod +x ./gradlew ./tools/verify-source.sh ./tools/verify-final.sh ./tools/verify-1.5.0.sh

      - name: Source sanity checks
        run: ./tools/verify-final.sh && ./tools/verify-1.5.0.sh

      - name: Run unit tests
        id: tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android lint
        id: lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint report on failure
        if: ${{ always() && steps.lint.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: AnimeVault-lint-report
          path: |
            app/build/reports/lint-results-debug.*
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Build debug APK
        id: build_apk
        if: ${{ always() && steps.tests.outcome == 'success' }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload AnimeVault APK
        if: ${{ always() && steps.build_apk.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: AnimeVault-1.5.0
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
