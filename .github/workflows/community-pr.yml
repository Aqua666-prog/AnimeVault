name: Community PR verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: community-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  edge-metadata:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only GitHub Environment metadata regression (no Supabase credentials)
        env:
          GH_METADATA_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import urllib.request
          import urllib.error
          from tools.community_edge_deploy import github_json, validate_environment, ENVIRONMENT, REPOSITORY
          validate_environment(github_json('/environments/' + ENVIRONMENT))
          print('authenticated_environment_metadata: HTTP200, required_reviewers verified')
          # Advisory reproduction of the old anonymous transport; never an authorization fallback.
          request=urllib.request.Request('https://api.github.com/repos/'+REPOSITORY+'/environments/'+ENVIRONMENT,
              headers={'Accept':'application/vnd.github+json','User-Agent':'AnimeVault-Edge-Deploy'})
          try:
              with urllib.request.urlopen(request,timeout=15) as response:
                  print('legacy_anonymous_http_status:',response.status)
          except urllib.error.HTTPError as error:
              print('legacy_anonymous_http_status:',error.code)
              print('legacy_anonymous_rate_exhausted:',(error.headers or {}).get('X-RateLimit-Remaining')=='0')
          except Exception:
              print('legacy_anonymous_transport: unavailable')
          PYCODE
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck Edge handlers without deployment or secrets
        run: deno check supabase/functions/community-ensure/index.ts supabase/functions/community-catalog-worker/index.ts
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Public test-only Firebase configuration (no repository secrets)
        run: python3 tools/write-ci-firebase-fixture.py
      - name: Static checks and existing Python tests
        run: |
          git diff --check
          node --test tools/test_community_zero_touch.mjs
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/verify-release-version.py --source app/build.gradle.kts
      - name: Kotlin, unit tests, lint and debug APK (CI only)
        run: bash gradlew --no-daemon compileDebugKotlin testDebugUnitTest lintDebug assembleDebug
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-pr-reports
          path: |
            app/build/reports/
            app/build/test-results/
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: community_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'psycopg[binary]==3.2.13'
      - name: Disposable database RLS, RPC and concurrency tests
        env:
          COMMUNITY_TEST_DATABASE_URL: postgresql://postgres:community_test_only@localhost:5432/postgres
        run: |
          python3 tools/test-community-database.py
          python3 tools/test-community-autosync-database.py
          python3 tools/test-community-canary-database.py
          python3 tools/test-community-zero-touch-database.py
          python3 tools/test-community-app-topics-database.py
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [24, 25, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 tools/write-ci-firebase-fixture.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Synthetic Auth, Keystore and spoiler semantics (CI emulator only)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: bash gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.sergey.animevault.community.CommunityAuthTest,com.sergey.animevault.community.CommunitySpoilerTest,com.sergey.animevault.community.CommunityDiscussionTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-device-${{ matrix.api }}
          path: app/build/reports/androidTests/
