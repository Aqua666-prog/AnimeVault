name: Audio Engine QA

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read

jobs:
  audio-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Audio engine unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --tests 'com.sergey.animevault.ui.player.audio.*' --tests 'com.sergey.animevault.ui.player.PlayerEqualizerTest'
      - name: Full unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon lintDebug
      - name: Assemble
        run: ./gradlew --no-daemon assembleDebug
