name: Ascension Baseline Profile

on:
  workflow_dispatch:
  push:
    branches: [feature/project-ascension]
    paths:
      - '.github/workflows/ascension-profile.yml'
      - 'tools/collect-ascension-profile.sh'
      - 'macrobenchmark/**'

permissions:
  contents: read

jobs:
  collect-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: python3 tools/restore-google-services.py
      - name: Prepare onboarding fixture and profileable APK
        run: >-
          ./gradlew --no-daemon -PanimeVaultBenchmarks=true -PanimeVaultProfileGeneration=true
          :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleBenchmark
          :macrobenchmark:assembleBenchmark
      - name: Verify the test APK is installable
        run: |
          tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$tools_dir/apksigner" verify macrobenchmark/build/outputs/apk/benchmark/macrobenchmark-benchmark.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Collect profiles on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/collect-ascension-profile.sh
      - name: Preserve generated rules and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnimeVault-profile-API35-${{ github.sha }}
          path: ascension-profile/
          if-no-files-found: warn
          retention-days: 14
